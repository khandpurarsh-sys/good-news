name: GoodNews
options:
  bundleIdPrefix: com.arsh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
targets:
  GoodNews:
    type: application
    platform: iOS
    sources:
      - path: GoodNews
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arsh.goodnews
        GENERATE_INFOPLIST: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Good News!"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ENABLE_TESTABILITY: YES
    dependencies:
      - target: GoodNewsWidget
        embed: true
  GoodNewsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GoodNewsWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arsh.goodnews.widget
        GENERATE_INFOPLIST: NO
        INFOPLIST_FILE: GoodNewsWidget/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  GoodNewsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GoodNewsTests
    settings:
      base:
        GENERATE_INFOPLIST: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.arsh.goodnews.tests
    dependencies:
      - target: GoodNews
schemes:
  GoodNews:
    build:
      targets:
        GoodNews: all
        GoodNewsWidget: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - GoodNewsTests
