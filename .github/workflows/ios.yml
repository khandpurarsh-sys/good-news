name: iOS build
on:
  workflow_dispatch:
    inputs:
      sign_and_upload:
        description: "Sign and upload to TestFlight (needs Apple secrets)"
        type: boolean
        default: false
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen
      - name: Unit tests (RSS engine)
        run: |
          xcodebuild -project GoodNews.xcodeproj -scheme GoodNews -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO test
      - name: Build app + widget (simulator)
        run: |
          xcodebuild -project GoodNews.xcodeproj -scheme GoodNews -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Screenshot previews (light/dark, app + 3 widget sizes)
        run: bash ci/screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: previews
          path: previews/*.png
      - name: Sign and upload to TestFlight
        if: ${{ inputs.sign_and_upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcodebuild -project GoodNews.xcodeproj -scheme GoodNews -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/GoodNews.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID \
            archive
          cat > $RUNNER_TEMP/export.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/GoodNews.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID
